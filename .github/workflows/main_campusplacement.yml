name: Build and deploy CampusPlacement to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build

      - name: Package application
        run: python deploy/package.py

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_216C074FFE49406C90BA4122538712A5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9440ED39A3E24A79ACDD3C1EE353E619 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3FF2187E93DC4DBF8946A6373C3B74AD }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: CampusPlacement
          slot-name: Production
          package: deploy/campusplacement.zip
          startup-command: python -m uvicorn web:app --host 0.0.0.0 --port 8000
